# Pinned so every machine and CI runner builds the same core.
# Bump deliberately; a toolchain bump is a PR of its own.
#
# A VERSION, not `stable` — the same one astrid-core pins (it calls other toolchains unsupported).
# `channel` and `rust-version` in Cargo.toml must agree (AATD-87).
#
# Targets: the two Android ABIs this app ships (arm64 phones, x86_64 emulators on Intel hosts).
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-linux-android", "x86_64-linux-android"]
