# The Android app's bindings to astrid-core.
#
# astrid-core is the shared client core (https://github.com/Graceful-Tools/astrid-core). Its rule 8
# puts each platform's binding layer in that platform's repository: astrid-windows keeps its C ABI,
# astrid-ios its UniFFI crate, and this is Android's — UniFFI again, whose Kotlin generator is
# first-party.
#
# The core is pinned by revision and bumped deliberately. Building against a local checkout instead
# is `scripts/build-core.sh --core ../astrid-core`, which patches the dependency for that build only.
[workspace]
resolver = "2"
members = ["astrid-android", "bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.dependencies]
astrid-core = { version = "0.1", git = "https://github.com/Graceful-Tools/astrid-core.git", rev = "b823213824c9ed86d7d962685a8cc0b7ee1bd171" }
uniffi = "0.32"

[profile.release]
# Size over the last few percent of speed (AATD-91): arm64 shipped 13.51 MB at opt-level 3, 11.38 MB
# at "s". "z" (10.59 MB) gives up loop vectorisation sqlite and serde lean on, and fat LTO saved 4 KB.
# scripts/check-native-size.sh holds the budget.
opt-level = "s"
lto = "thin"
codegen-units = 1
# The symbol table stays here (~3.5 MB per ABI) for the app's packaging to move into the bundle's
# native-debug-symbols for Play, stripping it from what ships (app/build.gradle.kts, AATD-91).
strip = "debuginfo"
# Unwind, not abort: every door catches a panic and answers with a failure, which only works if a
# panic unwinds to the catch.
panic = "unwind"

# What a debug APK ships: optimised and stripped. The dev profile's debug info made each .so ~148 MB,
# which is a 357 MB APK that takes a minute to install. Release APKs build with `--release`.
[profile.jni]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = "symbols"
