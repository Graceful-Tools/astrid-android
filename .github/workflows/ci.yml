# The PR gate: the same steps as `npm run predeploy`, so a green run here means what a green local
# run means. The core's own gate and the contract check against astrid-web run in astrid-core;
# what this repo pins is a revision that passed there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup
      - name: Gate
        run: ./scripts/predeploy.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # `npm run predeploy:full`'s extra step: the instrumented smoke tests on an emulator (AATD-80).
  # Until this job existed they ran only on the dev Mac, so a cloud agent could not see a device
  # test fail. x86_64 under KVM, not the Mac's arm64 image: hosted Linux runners only accelerate
  # x86. LiveAccountTest skips itself without a live cookie, which CI never holds.
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Core, and the test APKs
        run: |
          scripts/build-core.sh
          ./gradlew --console=plain assembleDebug assembleDebugAndroidTest
      - name: Instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # pixel_6, not the Mac's pixel_8: the runner's avdmanager has no pixel_8 profile. Same
          # 1080x2400 screen at ~411dp, so layouts and scroll distances match.
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          # Each line is its own shell. A Custom Tab left on top by a sign-in check covers the app
          # and times every test out (docs/TESTING.md), so Chrome goes first.
          script: |
            adb shell am force-stop com.android.chrome || true
            ./gradlew --console=plain connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  # The Rust dependency tree the APK ships, against the RustSec database — on every push and
  # weekly, since an advisory is published between commits (astrid-core's gate, task b6147418).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
