# The PR gate: the same steps as `npm run predeploy`, so a green run here means what a green local
# run means. The core's own gate and the contract check against astrid-web run in astrid-core;
# what this repo pins is a revision that passed there.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Packages named explicitly: the action's default list still includes the retired `tools`,
      # which no longer exists and fails the step.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018
      - name: Rust targets and cargo-ndk
        if: hashFiles('core/Cargo.toml') != ''
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        if: hashFiles('core/Cargo.toml') != ''
        with:
          workspaces: core
      - uses: gradle/actions/setup-gradle@v4
      - name: Gate
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: ./scripts/predeploy.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # The Rust dependency tree the APK ships, against the RustSec database — on every push and
  # weekly, since an advisory is published between commits (astrid-core's gate, task b6147418).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
